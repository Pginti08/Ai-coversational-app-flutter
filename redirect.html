<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script type="text/javascript">
        window.onload = function() {
            // Package/App IDs
            var androidPackageName = "com.vrozart.vousvous";
            var iosAppId = "YOUR_IOS_APP_ID"; // Replace with your actual iOS App ID
            
            // Detect iOS devices (iPhone, iPad, iPod)
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            
            var redirectUrl;
            
            if (isIOS) {
                // Redirect to App Store for iOS devices
                redirectUrl = "https://apps.apple.com/app/id" + iosAppId;
            } else {
                // Redirect to Play Store for all other devices (Android, etc.)
                redirectUrl = "https://play.google.com/store/apps/details?id=" + androidPackageName;
            }
            
            window.location.href = redirectUrl;
        };
    </script>
</head>
<body>
    <p>Redirecting to the VousVous App...</p>
    <p>If you are not redirected automatically, click the link below:</p>
    <p>
        <a href="https://play.google.com/store/apps/details?id=com.vrozart.vousvous">Android (Play Store)</a> | 
        <a href="https://apps.apple.com/app/idYOUR_IOS_APP_ID">iOS (App Store)</a>
    </p>
</body>
</html>
