<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VousVous - Download App</title>

  <!-- App Links Meta Tags -->
  <meta property="al:ios:url" content="vousvous://share" />
  <meta property="al:ios:app_store_id" content="YOUR_IOS_APP_ID" />
  <meta property="al:ios:app_name" content="VousVous" />
  <meta property="al:android:url" content="vousvous://share" />
  <meta property="al:android:package" content="com.vrozart.vousvous" />
  <meta property="al:android:app_name" content="VousVous" />

  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="VousVous" />
  <meta property="og:description" content="Download VousVous app" />
  <meta property="og:type" content="website" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #e0e0e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 32px;
      min-height: 20px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      margin: 24px 0;
    }

    .buttons-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-android {
      background: linear-gradient(135deg, #3ddc84, #00c853);
      color: #000;
    }

    .btn-ios {
      background: linear-gradient(135deg, #007aff, #5856d6);
      color: #fff;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .referral-badge {
      display: none;
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 24px;
      font-size: 13px;
    }

    .referral-badge span {
      color: #667eea;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">🎨</div>
    <h1>VousVous</h1>
    <p class="subtitle">Your Fashion Companion</p>

    <div class="spinner"></div>
    <p id="status">Opening app...</p>

    <div class="divider"></div>

    <p class="buttons-label">Or download the app:</p>
    <div class="buttons">
      <a id="androidBtn" href="#" class="btn btn-android">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M17.523 2.27l1.443-1.443a.5.5 0 01.707.707l-1.57 1.57A9.919 9.919 0 0122 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2c1.94 0 3.755.553 5.293 1.51zm.477 3.23a8 8 0 100 13L12 12l6-6.5zM8.5 10a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm7 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" />
        </svg>
        Android
      </a>
      <a id="iosBtn" href="#" class="btn btn-ios">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
        </svg>
        iOS
      </a>
    </div>

    <div id="referralBadge" class="referral-badge">
      Referral code: <span id="referralCode"></span>
    </div>
  </div>

  <script>
    // Configuration
    const CONFIG = {
      androidPackage: "com.vrozart.vousvous",
      iosAppId: "YOUR_IOS_APP_ID",
      playStoreUrl: "https://play.google.com/store/apps/details?id=com.vrozart.vousvous",
      appStoreUrl: "https://apps.apple.com/app/6758098618",
      deepLinkScheme: "vousvous://share"
    };

    // Detect platform
    function getPlatform() {
      const ua = navigator.userAgent || "";
      return {
        isIOS: /iPad|iPhone|iPod/.test(ua) && !window.MSStream,
        isAndroid: /android/i.test(ua)
      };
    }

    // Get URL parameters
    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        referralCode: params.get("refferalCode") || params.get("referralCode") || params.get("referral_code"),

      };
    }

    // Build deep link URL
    function buildDeepLink(params) {
      let url = CONFIG.deepLinkScheme;
      const query = [];

      if (params.referralCode) query.push(`refferalCode=${encodeURIComponent(params.referralCode)}`);

      return query.length ? `${url}?${query.join("&")}` : url;
    }

    // Build Play Store URL with referrer (for Android install referrer API)
    function buildPlayStoreUrl(referralCode) {
      let url = CONFIG.playStoreUrl;

      if (referralCode) {
        // Format: utm_source=xxx&refferalCode=XXXXX
        // The install_referrer_service.dart will parse this using Uri.splitQueryString
        const referrerParams = `utm_source=referral&refferalCode=${encodeURIComponent(referralCode)}`;
        url += `&referrer=${encodeURIComponent(referrerParams)}`;
      }

      return url;
    }

    // Copy to clipboard (for iOS fallback)
    function copyToClipboard(text) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        return true;
      } catch (e) {
        return false;
      }
    }

    // Update status message
    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // Try to open the app
    function tryOpenApp(deepLink, onFail) {
      let opened = false;
      const start = Date.now();

      // Detect if app opened
      const onHidden = () => { opened = true; };
      document.addEventListener("visibilitychange", onHidden);
      window.addEventListener("blur", onHidden);

      // Try deep link
      window.location.href = deepLink;

      // Check after delay
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onHidden);
        window.removeEventListener("blur", onHidden);

        if (!opened && !document.hidden && Date.now() - start < 2000) {
          onFail();
        }
      }, 1500);
    }

    // Initialize
    function init() {
      const platform = getPlatform();
      const params = getParams();

      // Show referral badge if present
      if (params.referralCode) {
        document.getElementById("referralBadge").style.display = "block";
        document.getElementById("referralCode").textContent = params.referralCode;
      }

      // Set button URLs
      const playStoreUrl = buildPlayStoreUrl(params.referralCode);
      const appStoreUrl = CONFIG.appStoreUrl;

      document.getElementById("androidBtn").href = playStoreUrl;
      document.getElementById("iosBtn").href = appStoreUrl;

      // iOS: Copy referral code to clipboard (fallback for install referrer)
      if (platform.isIOS && params.referralCode) {
        copyToClipboard(`refferalCode-${params.referralCode}`);
      }

      // Build deep link
      const deepLink = buildDeepLink(params);

      // Handle redirect based on platform
      if (platform.isAndroid) {
        setStatus("Opening app...");

        tryOpenApp(deepLink, () => {
          setStatus("Redirecting to Play Store...");
          window.location.href = playStoreUrl;
        });

      } else if (platform.isIOS) {
        setStatus("Opening app...");

        tryOpenApp(deepLink, () => {
          setStatus("Redirecting to App Store...");
          window.location.href = appStoreUrl;
        });

      } else {
        // Desktop
        setStatus("Choose your platform below");
        document.querySelector(".spinner").style.display = "none";
      }
    }

    // Start on page load
    window.onload = init;
  </script>
</body>

</html>
